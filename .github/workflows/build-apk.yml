name: Build APK

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build VM assets (base.qcow2.gz + kernel/initrd)
        run: bash scripts/build_qcow2.sh

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: |
          set -euo pipefail

          BUILD_DIR="$(mktemp -d)"

          flutter create \
            --platforms android \
            --project-name linxr \
            --org com.ai2th \
            "$BUILD_DIR"

          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$ANDROID_SDK" ]; then
            echo "ERROR: ANDROID_SDK_ROOT/ANDROID_HOME is not set"
            exit 1
          fi

          FLUTTER_SDK="$(dirname "$(dirname "$(command -v flutter)")")"
          if [ ! -d "$FLUTTER_SDK" ]; then
            echo "ERROR: Could not locate Flutter SDK dir"
            exit 1
          fi

          printf "sdk.dir=%s\nflutter.sdk=%s\n" "$ANDROID_SDK" "$FLUTTER_SDK" > "$BUILD_DIR/android/local.properties"

          cp -r lib/. "$BUILD_DIR/lib/"
          cp pubspec.yaml "$BUILD_DIR/pubspec.yaml"

          mkdir -p "$BUILD_DIR/assets"
          cp -r assets/. "$BUILD_DIR/assets/"

          mkdir -p "$BUILD_DIR/android/app/src/main"
          rm -rf "$BUILD_DIR/android/app/src/main/kotlin"
          cp -r android/app/src/main/kotlin "$BUILD_DIR/android/app/src/main/"
          cp android/app/src/main/AndroidManifest.xml "$BUILD_DIR/android/app/src/main/AndroidManifest.xml"
          cp -r android/app/src/main/res/. "$BUILD_DIR/android/app/src/main/res/"

          mkdir -p "$BUILD_DIR/android/app/src/main/assets"
          cp -r android/app/src/main/assets/. "$BUILD_DIR/android/app/src/main/assets/"

          if [ -d android/app/src/androidTest ]; then
            mkdir -p "$BUILD_DIR/android/app/src"
            cp -r android/app/src/androidTest "$BUILD_DIR/android/app/src/"
          fi

          APP_BUILD_FILE=""
          if [ -f "$BUILD_DIR/android/app/build.gradle" ]; then
            APP_BUILD_FILE="$BUILD_DIR/android/app/build.gradle"
          elif [ -f "$BUILD_DIR/android/app/build.gradle.kts" ]; then
            APP_BUILD_FILE="$BUILD_DIR/android/app/build.gradle.kts"
          else
            echo "ERROR: Could not find android/app build script"
            ls -la "$BUILD_DIR/android/app" || true
            exit 1
          fi

          python3 - "$APP_BUILD_FILE" << 'PY'
          import re
          import sys

          p = sys.argv[1]
          s = open(p, "r", encoding="utf-8").read()
          is_kts = p.endswith(".kts")

          if "useLegacyPackaging" not in s:
            m = re.search(r"\bandroid\s*\{", s)
            if not m:
              raise SystemExit("Could not find android { block in " + p)
            insert = (
              """
                packaging {
                    jniLibs {
                        useLegacyPackaging = true
                    }
                }
              """
              if is_kts
              else
              """
                packagingOptions {
                    jniLibs {
                        useLegacyPackaging true
                    }
                }
              """
            )
            s = s[: m.end()] + "\n" + insert + "\n" + s[m.end() :]

          if "noCompress" not in s and "androidResources" not in s:
            m = re.search(r"\bandroid\s*\{", s)
            if not m:
              raise SystemExit("Could not find android { block in " + p)
            insert = (
              """
                androidResources {
                    noCompress += setOf("gz", "virt")
                }
              """
              if is_kts
              else
              """
                androidResources {
                    noCompress += ['gz', 'virt']
                }
              """
            )
            s = s[: m.end()] + "\n" + insert + "\n" + s[m.end() :]

          open(p, "w", encoding="utf-8").write(s)
          PY

          cd "$BUILD_DIR"

          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --debug

          mkdir -p "$GITHUB_WORKSPACE/build"
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/build/linxr-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linxr-debug-apk
          path: build/linxr-debug.apk
